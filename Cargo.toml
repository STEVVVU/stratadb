[package]
name = "stratadb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A crash-safe embedded key-value storage engine"
license = "MIT"

[lib]
name = "stratadb"
path = "src/lib.rs"

[[bin]]
name = "stratadb"
path = "src/main.rs"

[features]
# Opt-in comparison benchmarks against third-party embedded engines. Kept
# behind a feature so the default build stays dependency-light and so a
# comparison engine failing to build can never break `cargo test`.
compare = ["dep:redb", "dep:sled"]

[dependencies]
# SIMD/CLMUL-accelerated CRC-32/ISO-HDLC. Same polynomial and same output as
# the scalar reference in `src/crc32.rs`, which is retained and differentially
# tested against this crate (see `src/crc32.rs`).
crc32fast = "1.5.0"
# Derives Display/Error for the public error enum. Message text is pinned by
# the `#[error(...)]` attributes so the wire-visible strings did not change.
thiserror = "2.0.17"
# The benchmark report artifact in `benchmarks/` is a versioned machine-readable
# schema; it is serialized from a struct rather than hand-printed.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Comparison-only engines, pulled in by `--features compare`. Both are pure
# Rust, so the comparison build works on Windows/MSVC with no C++ toolchain
# (unlike `librocksdb-sys`). They are unused by the library itself.
redb = { version = "2.6.3", optional = true }
sled = { version = "0.34.7", optional = true }

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3.24.0"

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "comparison"
harness = false
required-features = ["compare"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
