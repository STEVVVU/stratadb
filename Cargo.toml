[package]
name = "stratadb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A crash-safe embedded key-value storage engine"
license = "MIT"

[lib]
name = "stratadb"
path = "src/lib.rs"

[[bin]]
name = "stratadb"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
